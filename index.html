<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitty</title>
<meta name="description" content="Kitty's links. Tap to say hello.">
<meta property="og:title" content="Kitty">
<meta property="og:description" content="Tap to say hello.">
<meta name="theme-color" content="#fea9c6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fea9c6;--block:#ffe3ee;--tile:#ffc2d9;--ring:#d93d7e;--ring2:#a8265d;--ink:#5c2a45;--head:#8a2a55}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;color:var(--ink);font:16px/1.5 Fredoka,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
       background:var(--bg);padding:max(18px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));display:flex;justify-content:center}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}

  /* Hello lettering */
  .hello{display:block;font-weight:700;font-size:3.3rem;line-height:1;color:#fff;-webkit-text-stroke:3px var(--ring);paint-order:stroke fill;text-shadow:0 5px 0 var(--ring2);user-select:none}
  .hello.top{transform:rotate(-7deg);margin:8px 0 0 10px}
  .hello.mid{transform:rotate(5deg);text-align:right;font-size:2.4rem;margin:2px 14px -4px 0}
  .hello.bot{transform:rotate(-5deg);text-align:center;font-size:2.8rem;margin-top:4px}

  /* blocks: solid light pink inside, thick dark pink 3D ring */
  @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
  .block{position:relative;border:3.5px solid transparent;border-radius:28px;
         background:linear-gradient(var(--block),var(--block)) padding-box,var(--led) border-box;
         --led:conic-gradient(from var(--a),#ff3d8b 0 8%,#ffd23f 8% 16%,#3ee0a0 16% 24%,#3fb6ff 24% 32%,#a76bff 32% 40%,#ff3d8b 40% 48%,#ffd23f 48% 56%,#3ee0a0 56% 64%,#3fb6ff 64% 72%,#a76bff 72% 80%,#ff7a2f 80% 90%,#ff3d8b 90% 100%);
         animation:led 3.5s linear infinite;
         box-shadow:inset 0 4px 0 rgba(255,255,255,.9),inset 0 -6px 12px rgba(168,38,93,.12),
                    0 4px 0 var(--ring),0 8px 0 var(--ring),0 12px 0 var(--ring2),0 0 18px rgba(255,255,255,.9),0 26px 36px rgba(120,20,70,.35);
         transform:perspective(900px) rotateX(3deg)}
  @keyframes led{to{--a:360deg}}
  @media(prefers-reduced-motion:reduce){.block{animation:none}}
  .hero{padding:24px 22px 20px;text-align:center}
  .photo{width:min(240px,72%);aspect-ratio:3/4;margin:0 auto;border-radius:24px;padding:4px;background:var(--ring);box-shadow:0 6px 0 var(--ring2)}
  .photo img{width:100%;height:100%;border-radius:20px;object-fit:cover;object-position:50% 20%;border:4px solid #fff;display:block}
  h1{font-family:Pacifico,cursive;font-weight:400;font-size:3rem;line-height:1.2;color:var(--ring);margin:16px 0 0;text-shadow:0 3px 0 #fff}

  section h2{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--head);margin:0 8px 10px}

  /* 3 icons per block, each in its own tile (same as Chris's card) */
  .icons{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .soc{display:flex;justify-content:center;align-items:center;padding:14px 0;border-radius:20px;background:var(--tile);border:2px solid #f39bbd;
       box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #f39bbd;cursor:pointer;font:inherit;width:100%;text-decoration:none}

  /* 3D icon tile */
  .ico3d{position:relative;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;background:var(--c,#333);
    box-shadow:0 9px 0 -1px var(--d,#000),0 16px 22px rgba(92,20,55,.4),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.2);
    transform:translateY(-4px);transition:transform .15s,box-shadow .15s}
  .ico3d::after{content:"";position:absolute;left:10%;right:10%;top:6%;height:42%;border-radius:16px 16px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none;z-index:1}
  .ico3d img{width:100%;height:100%;border-radius:inherit;display:block}
  .ico3d svg{position:relative;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .soc:hover .ico3d{transform:translateY(-7px) rotate(-3deg)}
  .soc:active .ico3d{transform:translateY(2px);box-shadow:0 3px 0 -1px var(--d,#000),0 6px 10px rgba(92,20,55,.35)}
  .i-line{--c:#00cf2e;--d:#037a22}.i-wa{--c:#00ba37;--d:#037a22}
  .i-phone{--c:linear-gradient(145deg,#f7e2b0,#c99a45);--d:#8a6420;color:#3a2a0b}
  .i-ig{--c:#c13584;--d:#5a1c8f}.i-tt{--c:#111;--d:#000}.i-fb{--c:#1877f2;--d:#0d3a8f}

  .save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-weight:700;font-size:1.08rem;padding:16px;border-radius:20px;border:0;cursor:pointer;color:#fff;
        background:linear-gradient(180deg,#ef5b98,var(--ring));box-shadow:0 7px 0 var(--ring2),0 16px 26px rgba(168,38,93,.35),inset 0 2px 0 rgba(255,255,255,.45)}
  .save:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ring2)}
  footer{text-align:center;color:var(--head);font-size:.78rem}
  footer a{color:inherit}

  .toast{position:fixed;left:50%;bottom:24px;z-index:9;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:var(--ink);border:4px solid var(--ring);border-radius:18px;padding:12px 16px;font-weight:600;box-shadow:0 14px 30px rgba(168,38,93,.35);transition:.25s;width:min(90vw,320px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .in{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:perspective(900px) rotateX(3deg)}}
  .hero.block.in{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards,led 3.5s linear infinite}
  @media(prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}
</style>
<script src="https://cevyq-stats.chris-e41.workers.dev/t.js" data-card="kitty" data-name="Kitty" defer></script>
</head>

const PHONE = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';

document.getElementById("photo").src = ME.photo;
document.getElementById("name").textContent = ME.name;
if (ME.phone) ME.contact[2].url = "tel:" + ME.phone;

const toast = document.getElementById("toast"); let tt;
function soon(){ toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 2200); }

function tile(s){
  const a = document.createElement(s.url ? "a" : "button");
  a.className = "soc";
  if (s.url){ a.href = s.url; a.rel = "noopener"; } else { a.type = "button"; a.addEventListener("click", soon); }
  a.innerHTML = '<span class="ico3d '+s.cls+'">'+(s.logo ? '<img src="'+LOGO[s.logo]+'" alt="">' : PHONE)+'</span>';
  a.setAttribute("aria-label", s.name); a.title = s.name;
  return a;
}
ME.contact.forEach(s => document.getElementById("contact").appendChild(tile(s)));
ME.follow.forEach(s => document.getElementById("follow").appendChild(tile(s)));

document.getElementById("save").addEventListener("click", () => {
  const v = ["BEGIN:VCARD","VERSION:3.0","FN:"+ME.name,"N:;"+ME.name+";;;"];
  if (ME.phone) v.push("TEL;TYPE=CELL:"+ME.phone);
  ME.follow.filter(f => f.url).forEach(f => v.push("URL:"+f.url));
  v.push("END:VCARD");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v.join("\r\n")],{type:"text/vcard"}));
  a.download = "Kitty.vcf"; document.body.appendChild(a); a.click(); a.remove();
});
</script>
